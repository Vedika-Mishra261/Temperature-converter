<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="converter-card">
      <header class="card-header">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert values between Celsius, Fahrenheit, and Kelvin</p>
      </header>

      <div class="form-row">
        <div class="input-group">
          <label for="temperatureInput">Temperature</label>
          <input type="number" id="temperatureInput" placeholder="e.g. 25" step="any">
        </div>

        <div class="input-group">
          <label for="unitSelect">From Unit</label>
          <select id="unitSelect">
            <option value="celsius">Celsius (&deg;C)</option>
            <option value="fahrenheit">Fahrenheit (&deg;F)</option>
            <option value="kelvin">Kelvin (K)</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="clearBtn" class="clear-btn">Clear</button>
      </div>

      <p id="errorMessage" class="error-message" aria-live="polite"></p>

      <h2 class="results-title">Converted Results</h2>
      <div class="results">
        <div class="result-card">
          <h3>Celsius</h3>
          <p id="celsiusResult">-- &deg;C</p>
        </div>
        <div class="result-card">
          <h3>Fahrenheit</h3>
          <p id="fahrenheitResult">-- &deg;F</p>
        </div>
        <div class="result-card">
          <h3>Kelvin</h3>
          <p id="kelvinResult">-- K</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
